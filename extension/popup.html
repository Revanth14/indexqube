<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IndexQube</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>IndexQube</h1>
        <label class="switch">
          <input id="enabled" type="checkbox">
          <span>Enabled</span>
        </label>
      </header>

      <label>
        Gateway URL
        <input id="gatewayUrl" type="url" spellcheck="false" placeholder="http://localhost:8080">
      </label>

      <label>
        Session key
        <div class="inline">
          <input id="sessionKey" type="text" spellcheck="false">
          <button id="resetSession" type="button" title="Reset session">Reset</button>
        </div>
        <div class="inline meta-row">
          <span id="sessionSummary">Session inactive</span>
          <button id="resetBoth" type="button" title="Reset session and usage">Reset all</button>
        </div>
      </label>

      <div class="grid">
        <label>
          Context path
          <input id="contextPath" type="text" spellcheck="false" placeholder="optional, e.g. src/file.go">
        </label>
        <label>
          Lang
          <input id="contextLang" type="text" spellcheck="false" placeholder="optional, e.g. go">
        </label>
      </div>

      <label>
        Project memory
        <textarea id="projectMemory" rows="5" spellcheck="false" placeholder="Optional rules sent as X-IQ-Project-Memory"></textarea>
      </label>

      <section class="usage" aria-label="Usage">
        <div class="usage-head">
          <h2>Usage</h2>
          <button id="resetUsage" type="button" title="Reset usage stats">Reset</button>
        </div>
        <dl>
          <div>
            <dt>Requests</dt>
            <dd id="usageRequests">0</dd>
          </div>
          <div>
            <dt>Optimized</dt>
            <dd id="usageOptimized">0</dd>
          </div>
          <div>
            <dt>Tokens saved</dt>
            <dd id="usageTokensSaved">0</dd>
          </div>
          <div>
            <dt>Bytes saved</dt>
            <dd id="usageBytesSaved">0</dd>
          </div>
          <div>
            <dt>Blocks pruned</dt>
            <dd id="usageBlocksPruned">0</dd>
          </div>
          <div>
            <dt>Errors</dt>
            <dd id="usageErrors">0</dd>
          </div>
        </dl>
        <section class="last-result" aria-label="Last optimization result">
          <div class="last-head">
            <h3>Last request</h3>
            <span id="lastState" class="pill">Idle</span>
          </div>
          <dl class="debug-grid">
            <div>
              <dt>Blocks seen</dt>
              <dd id="lastBlocksSeen">0</dd>
            </div>
            <div>
              <dt>Pruned</dt>
              <dd id="lastBlocksPruned">0</dd>
            </div>
            <div>
              <dt>Skipped</dt>
              <dd id="lastBlocksSkipped">0</dd>
            </div>
            <div>
              <dt>Tokens</dt>
              <dd id="lastTokens">0 -> 0</dd>
            </div>
          </dl>
          <p id="usageLast">No optimized requests yet</p>
          <p id="lastSkipReasons"></p>
        </section>
      </section>

      <footer>
        <button id="save" type="button">Save</button>
        <span id="status" role="status" aria-live="polite"></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
