name: gateway-ci

on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'Makefile'
      - 'scripts/install.sh'
      - 'scripts/package_release.sh'
      - 'scripts/reproducible_tar.py'
      - 'scripts/test_installer.sh'
      - 'scripts/real_repo_alpha.sh'
      - '.github/workflows/gateway-ci.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'Makefile'
      - 'scripts/install.sh'
      - 'scripts/package_release.sh'
      - 'scripts/reproducible_tar.py'
      - 'scripts/test_installer.sh'
      - 'scripts/real_repo_alpha.sh'
      - '.github/workflows/gateway-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: format + vet + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: gateway/go.sum

      - name: Verify module checksums
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf 'The following Go files need gofmt:\n%s\n' "$unformatted"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test (race detector enabled)
        run: go test -race -count=1 ./...

      - name: Build gateway and CLI
        run: |
          go build -trimpath ./cmd/gateway
          go build -trimpath ./cmd/iq

      - name: Test installer update and rollback
        working-directory: ${{ github.workspace }}
        run: make installer-test
