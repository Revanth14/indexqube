name: signed-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, attest, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: gateway/go.sum

      - name: Verify module checksums
        working-directory: gateway
        run: go mod verify

      - name: Run race-enabled test suite
        working-directory: gateway
        run: go test -race -count=1 ./...

      - name: Test atomic installer update and rollback
        run: make installer-test

      - name: Build reproducible macOS and Linux bundles
        run: |
          bash scripts/package_release.sh "${GITHUB_REF_NAME}" "$GITHUB_WORKSPACE/dist"
          bash scripts/package_release.sh "${GITHUB_REF_NAME}" "$RUNNER_TEMP/dist-repeat"
          diff -u "$GITHUB_WORKSPACE/dist/checksums.txt" "$RUNNER_TEMP/dist-repeat/checksums.txt"

      - name: Validate release archives
        run: |
          for archive in dist/indexqube_*.tar.gz; do
            tar -tzf "$archive" | grep -qx 'iq'
            tar -tzf "$archive" | grep -qx 'indexqube-gateway'
            tar -tzf "$archive" | grep -qx 'install.sh'
          done

      - name: Generate signed Sigstore build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
