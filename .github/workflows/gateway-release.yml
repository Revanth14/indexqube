name: gateway-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  release:
    name: Build & Release Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: gateway/go.sum

      - name: Verify module checksums
        run: go mod verify

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build Linux amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -ldflags="-X main.version=${{ github.ref_name }}" \
              -o ../dist/indexqube-gateway-linux-amd64 \
              ./cmd/gateway/

      - name: Build Linux arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath \
              -ldflags="-X main.version=${{ github.ref_name }}" \
              -o ../dist/indexqube-gateway-linux-arm64 \
              ./cmd/gateway/

      - name: Build iq wrapper – Linux amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -ldflags="-X main.version=${{ github.ref_name }}" \
              -o ../dist/iq-linux-amd64 \
              ./cmd/iq/

      - name: Build iq wrapper – macOS arm64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath \
              -ldflags="-X main.version=${{ github.ref_name }}" \
              -o ../dist/iq-darwin-arm64 \
              ./cmd/iq/

      - name: Build iq wrapper – macOS amd64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -trimpath \
              -ldflags="-X main.version=${{ github.ref_name }}" \
              -o ../dist/iq-darwin-amd64 \
              ./cmd/iq/

      - name: Create checksums
        working-directory: dist
        run: sha256sum indexqube-gateway-linux-* iq-* > checksums.txt && cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/indexqube-gateway-linux-amd64
            dist/indexqube-gateway-linux-arm64
            dist/iq-linux-amd64
            dist/iq-darwin-arm64
            dist/iq-darwin-amd64
            dist/checksums.txt
